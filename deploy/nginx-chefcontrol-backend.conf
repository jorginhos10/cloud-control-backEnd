# Reverse proxy for the ChefControl FastAPI backend.
# Copy to /etc/nginx/sites-available/chefcontrol-backend, symlink into
# sites-enabled, then run certbot --nginx to fill in the SSL block.
#
# Replace API_DOMAIN before use.

server {
    listen 80;
    listen [::]:80;
    server_name API_DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
